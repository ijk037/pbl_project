<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="assets/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/script.js" defer></script>
</head>

<body>

<div class="dashboard-container">

  <h1>📊 My Academic Dashboard</h1>

  <!-- Summary Cards -->
  <div class="summary">
    <div class="card">
      <h3>Average Mid</h3>
      <p id="mid">-</p>
    </div>

    <div class="card">
      <h3>Average End</h3>
      <p id="end">-</p>
    </div>

    <div class="card highlight">
      <h3>Predicted</h3>
      <p id="predictionResult">-</p>
    </div>
  </div>

  <!-- Prediction Controls -->
  <div class="prediction-box">
    <h3>Predict Next Exam</h3>

    <select id="predictType">
      <option value="mid">Predict Midsem</option>
      <option value="end">Predict Endsem</option>
    </select>

    <button onclick="predictMarks()">Predict</button>
  </div>

  <!-- Marks Table -->
  <h3>Semester Performance</h3>
  <table id="marksTable">
    <thead>
      <tr>
        <th>Semester</th>
        <th>Mid</th>
        <th>End</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Chart -->
  <h3>Progress Chart</h3>
  <canvas id="performanceChart"></canvas>

  <button class="download-btn" onclick="downloadPDF()">
    Download Full Report
  </button>

</div>

</body>
</html>

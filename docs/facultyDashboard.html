<!DOCTYPE html>
<html>
<head>
  <title>Faculty Dashboard</title>

  <link rel="stylesheet" href="assets/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/script.js" defer></script>
</head>

<body>

<div class="faculty-container">

  <h1>👩‍🏫 Faculty Dashboard</h1>

  <!-- SEARCH STUDENT -->
  <div class="faculty-card search-card">
    <h3>Search Student</h3>

    <input type="text"
           id="searchRegNo"
           placeholder="Enter Registration Number">

    <button onclick="fetchStudentByReg()">
      Load Student
    </button>
  </div>


  <!-- STUDENT INFO -->
  <div id="studentSection" style="display:none;">

    <div class="faculty-card student-info">
      <h2 id="studentName"></h2>
      <p><strong>Email:</strong> <span id="studentEmail"></span></p>
      <p><strong>Reg No:</strong> <span id="studentReg"></span></p>
    </div>


    <!-- ADD MARKS -->
    <div class="faculty-card">
      <h3>Add / Update Marks</h3>

<select id="markType">
  <option value="both">Mid + End</option>
  <option value="mid">Only Mid</option>
  <option value="end">Only End</option>
</select>

<input type="number" id="semesterInput" placeholder="Semester">
<input type="number" id="midInput" placeholder="Mid Marks">
<input type="number" id="endInput" placeholder="End Marks">

<button onclick="uploadMarks()">Save Marks</button>
    </div>


    <!-- PERFORMANCE TABLE -->
    <div class="faculty-card">
      <h3>Academic History</h3>

      <table id="facultyTable">
        <thead>
          <tr>
            <th>Semester</th>
            <th>Mid</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>


    <!-- ANALYTICS -->
    <div class="faculty-card analytics-card">
      <h3>Performance Analysis</h3>

      <div class="analysis-summary">
        <div>
          <h4>Average Mid</h4>
          <p id="facultyAvgMid">-</p>
        </div>
        <div>
          <h4>Average End</h4>
          <p id="facultyAvgEnd">-</p>
        </div>
        <div>
          <h4>Growth Trend</h4>
          <p id="growthTrend">-</p>
        </div>
      </div>

      <canvas id="facultyChart"></canvas>
    </div>

  </div>

</div>

</body>
</html>
